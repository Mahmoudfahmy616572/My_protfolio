  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #121212; }
    #splash {
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100;
      background: #121212; flex-direction: column;
      font-family: -apple-system, sans-serif;
      transition: opacity 0.5s ease-out;
    }
    #splash h1 { color: #1565C0; font-size: 28px; font-weight: 600; margin: 0; }
    #splash p { color: #888; margin-top: 8px; font-size: 14px; }
    .loader {
      width: 40px; height: 40px; border: 3px solid #333;
      border-top-color: #1565C0; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    flutter-view { display: block; width: 100%; height: 100%; }
  </style>

<body>
  <div id="splash">
    <div class="loader"></div>
    <h1>Mahmoud Fahmy</h1>
    <p>Loading...</p>
  </div>
  <script>
    var splash = document.getElementById('splash');
    function hideSplash() {
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      setTimeout(function() { splash.style.display = 'none'; }, 500);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    setTimeout(hideSplash, 6000);
  </script>
